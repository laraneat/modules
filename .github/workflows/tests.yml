name: Tests

on:
  push:
    branches: [master, 2.x]
  pull_request:
    branches: [master, 2.x]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        laravel: ['10.*', '11.*', '12.*', '13.*']
        exclude:
          - { php: '8.1', laravel: '11.*' }
          - { php: '8.1', laravel: '12.*' }
          - { php: '8.1', laravel: '13.*' }
          - { php: '8.2', laravel: '13.*' }
          - { php: '8.5', laravel: '10.*' }
          - { php: '8.5', laravel: '11.*' }

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, json
          coverage: none

      # Laravel 10 and 11 are no longer supported and get no security fixes, so the advisories block them.
      - name: Allow unsupported Laravel versions
        if: matrix.laravel == '10.*' || matrix.laravel == '11.*'
        run: composer remove --dev roave/security-advisories --no-update --no-interaction

      # PHP 8.1 is no longer supported either: the test tools that still run on it have advisories,
      # and the later releases of the snapshot plugin that allow it are broken.
      - name: Use the last test tools for PHP 8.1
        if: matrix.php == '8.1'
        run: |
          composer config audit.block-insecure false
          composer require --dev "spatie/pest-plugin-snapshots:2.2.1" "spatie/phpunit-snapshot-assertions:5.2.3" --no-update --no-interaction

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction

      - name: Run tests
        run: composer test

  static-analysis:
    runs-on: ubuntu-latest

    name: Static Analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, json
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Run PHPStan
        run: composer analyse

      - name: Audit dependencies
        run: composer audit

  code-style:
    runs-on: ubuntu-latest

    name: Code Style

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, json
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Check code style
        run: ./vendor/bin/php-cs-fixer fix --dry-run --diff --allow-risky=yes
