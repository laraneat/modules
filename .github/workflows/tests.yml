name: Tests

on:
  push:
    branches: [master, 3.x]
  pull_request:
    branches: [master, 3.x]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.3', '8.4', '8.5']
        dependencies: [stable]
        experimental: [false]
        include:
          - { os: ubuntu-latest, php: '8.3', dependencies: lowest, experimental: false }
          - { os: windows-latest, php: '8.4', dependencies: stable, experimental: true }
          - { os: ubuntu-latest, php: '8.6', dependencies: stable, experimental: true }

    name: PHP ${{ matrix.php }} - ${{ matrix.dependencies }}${{ matrix.os == 'windows-latest' && ' - Windows' || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, fileinfo, libxml, mbstring, zip, json, pdo_sqlite
          coverage: none

      # Packages declare the PHP versions they support, and a PHP release in development is newer than all of them.
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }} ${{ matrix.php == '8.6' && '--ignore-platform-req=php+' || '' }}

      - name: Run tests
        run: vendor/bin/pest --parallel --order-by=random

  coverage:
    runs-on: ubuntu-latest

    name: Coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, json, pdo_sqlite
          coverage: pcov

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Check the coverage
        run: vendor/bin/pest --coverage --min=95

      - name: Check the mutation score
        run: vendor/bin/pest --mutate --everything --covered-only --parallel --min=85

  static-analysis:
    runs-on: ubuntu-latest

    name: Static Analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, json
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Run PHPStan
        run: composer analyse

      - name: Check code style
        run: composer lint

      - name: Audit dependencies
        run: composer audit
